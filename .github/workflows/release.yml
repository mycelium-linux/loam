name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-13
            target: x86_64-apple-darwin
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: build
        run: |
          cargo build --release --target "${{ matrix.target }}" \
            -p loam --features loam/surface -p loam-ble-host
      - name: package
        run: |
          set -euo pipefail
          name="loam-${GITHUB_REF_NAME}-${TARGET}"
          mkdir -p "dist/$name/bin" "dist/$name/share/loam"
          cp "target/${TARGET}/release/loam" "dist/$name/bin/"
          cp "target/${TARGET}/release/loamd" "dist/$name/bin/"
          cp "target/${TARGET}/release/loam-ble-host" "dist/$name/bin/"
          cp "target/${TARGET}/release/loam-mcp" "dist/$name/bin/"
          cp -R wit "dist/$name/share/loam/wit"
          cp README.md LICENSE-APACHE LICENSE-MIT "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          if command -v sha256sum >/dev/null 2>&1; then
            (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
          else
            (cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256")
          fi
        env:
          TARGET: ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: loam-${{ matrix.target }}
          path: dist/*.tar.gz*
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: checksums
        run: |
          cd dist
          cat *.sha256 > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
          generate_release_notes: true
