name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: soil-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      # A path dependency that escapes this checkout is a sibling worktree that
      # happened to exist on the machine the branch was written on: the tree
      # compiles there and nowhere else. Cheap and offline, so it runs before
      # anything that has to compile.
      - name: Path dependencies stay inside the checkout
        run: scripts/check-path-deps.sh

      # libghostty-vt is compiled by Zig, and Ghostty builds only against an
      # exact minor version. `scripts/bootstrap-toolchain.sh` owns that pin and
      # installs the toolchain where `.cargo/config.toml` points `ZIG`, so keying
      # the cache on the script means bumping the version invalidates it without
      # a second copy of the number in this file.
      - uses: actions/cache@v4
        with:
          path: .toolchain
          key: zig-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/bootstrap-toolchain.sh') }}
      - name: Zig toolchain
        run: scripts/bootstrap-toolchain.sh

      # The lint gate is the dead-code gate. `dead_code`, `unused_imports`, and
      # the rest of the unused family are warnings, `-D warnings` makes them
      # failures, and the fix is a delete rather than a reword.
      #
      # The gate names crates instead of taking the whole workspace because the
      # workspace does not build from a bare checkout yet: mush and
      # soil-notify-host embed a prebuilt Spore wasm, and canvas-winit still
      # carries lints of its own. A gate that cannot run is worse than no gate,
      # so a crate joins this list in the change that makes it green here.
      - name: Clippy
        run: cargo clippy -p soil -p soil-agent-host -p soil-vt --all-targets --locked -- -D warnings

      # `soil`'s own suite joins this step once it is green: three
      # `records_host` tests (upsert_get_scan_and_delete and two neighbours)
      # fail in every checkout today. That is a bug to fix, not a hole to widen
      # the gate around.
      - name: Test
        run: cargo test -p soil-agent-host --locked
