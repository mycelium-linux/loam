name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-wasip2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-tools
      - uses: Swatinem/rust-cache@v2
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      - name: format
        run: cargo fmt --all --check
      - name: check
        run: cargo check --workspace
      - name: check binaries
        run: cargo check -p loam --features surface --bins
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: clippy binaries
        run: cargo clippy -p loam --features surface --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace
      - name: architecture gate
        run: scripts/check-architecture.sh
      - name: WIT gate
        run: scripts/check-wit.sh
      - name: surface fixture
        run: scripts/check-surface-fixture.sh
