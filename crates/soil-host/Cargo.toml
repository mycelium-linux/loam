[package]
name = "soil-host"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
default = ["model2vec"]
model2vec = ["dep:model2vec-rs"]
remote = []
# The fungOS control-plane adapter (`fungos:mycelium/fleet`): a live read of the
# Mycelium fleet. A product opts in; the library does not reach for a control
# plane on its own.
mycelium = []
# The Unibus bus (`soil:unibus`). Off means neither the client crates nor the
# adapter are in the build; a Spore granted `soil:unibus` is then refused at
# launch instead of running with a bus that answers `unavailable` forever.
unibus = ["dep:unibus", "dep:unibus-sdk"]

[dependencies]
anyhow = "1"
base64 = "0.22"
blake3 = "1"
bytes = "1"
clap = { version = "4", features = ["derive"] }
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
fungos-records.workspace = true
fungos-vfs = { git = "https://github.com/fungOS-linux/fungos-vfs.git", rev = "8ad45a7fb1ce01fbbc6f764d10524baf5a24c0af" }
hmac = "0.12"
http = "1"
http-body = "1"
http-body-util = "0.1"
hyper = { version = "1", default-features = false, features = ["http1", "server"] }
ipnet = "2"
model2vec-rs = { version = "0.4", default-features = false, features = ["fancy-regex", "hf-hub"], optional = true }
regex = "1"
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tiny_http = "0.12"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
unibus = { git = "https://github.com/fungOS-linux/unibus.git", rev = "8bf8f79", optional = true }
unibus-sdk = { git = "https://github.com/fungOS-linux/unibus.git", rev = "8bf8f79", optional = true }
url = "2"
ureq = { version = "2", features = ["json"] }
# Presenting this node's mesh identity to an allowlisted origin. Same rustls
# build ureq already links, with the `ring` provider the workspace already uses.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2"
wasmtime = { version = "50", features = ["anyhow"] }
wasmtime-wasi = { version = "50", default-features = false, features = ["p2"] }
wasmtime-wasi-http = { version = "50", default-features = false, features = ["default-send-request", "p2"] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "soil-wasi-http"
path = "src/bin/soil-wasi-http.rs"

[[test]]
name = "confluence_spore"
# One Spore that observes and publishes bus frames: the test needs the adapter
# the slim profile leaves out.
required-features = ["unibus"]
