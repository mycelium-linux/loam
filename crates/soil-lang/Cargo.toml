[package]
name = "soil-lang"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Soil's Lisp: reader, evaluator, typed core, and Wasm backends"

[features]
default = ["witgen"]
# Native REPL/CLI capability bridge. The interpreter core builds without this.
native = ["engine", "dep:soil"]
# Wasmtime-backed tooling: the image server and Wasm execution tests.
engine = ["dep:wasmtime"]
# WIT -> .soil binding generator (native tooling only).
witgen = ["dep:wit-parser"]

[dependencies]
anyhow = "1"
blake3 = "1"
serde_json = "1"
soil = { path = "../soil", optional = true, default-features = false, features = ["vfs", "records", "unibus", "wasi"] }
wasm-encoder = "0.263.0"
wit-parser = { version = "0.263.0", optional = true }

[[bin]]
name = "soil-lang"
path = "src/bin/soil-lang.rs"
required-features = ["native"]

[[bin]]
name = "soil-image"
path = "src/bin/soil-image.rs"
required-features = ["native"]

[[bin]]
name = "soil-witgen"
path = "src/bin/soil-witgen.rs"
required-features = ["witgen"]

# Native-only: the image server executes compiled numeric-core modules. The
# language core still builds for wasm32 without a native engine.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wasmtime = { version = "50", optional = true, default-features = false, features = ["anyhow", "cranelift", "runtime", "std"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
