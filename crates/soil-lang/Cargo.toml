[package]
name = "soil-lang"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Soil's Lisp: reader, evaluator, typed core, and Wasm backends"

[dependencies]
anyhow = "1"
fungos-records = { workspace = true }
serde_json = "1"
soil = { path = "../soil", default-features = false, features = ["vfs", "records", "http"] }
wasm-encoder = "0.263.0"
wit-parser = "0.263.0"

[dev-dependencies]
tempfile = "3"
wasmtime = "50"

[lints]
workspace = true
