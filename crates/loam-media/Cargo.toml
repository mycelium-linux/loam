[package]
name = "loam-media"
description = "Native audio output and codec host capabilities"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "loam_media"

[dependencies]
anyhow = "1"
audiopus = "0.3.0-rc.0"
cpal = "0.18"
hound = "3"
isochrone = { git = "https://github.com/ajmwagar/isochrone.git", rev = "934e1c99f594ea6bd122cf745ee6ab899bab53d9" }
isochrone-core = { git = "https://github.com/ajmwagar/isochrone.git", rev = "934e1c99f594ea6bd122cf745ee6ab899bab53d9" }
rtrb = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
wasmtime = { version = "50", default-features = false, features = [
    "anyhow",
    "component-model",
    "cranelift",
    "runtime",
    "std",
] }
wasmtime-wasi = { version = "50", default-features = false, features = ["p2"] }

[lints]
workspace = true
