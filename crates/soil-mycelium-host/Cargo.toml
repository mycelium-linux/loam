[package]
name = "soil-mycelium-host"
description = "Host side of fungos:mycelium/fleet: a live, bounded Mycelium read"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
wasmtime = { version = "50", features = ["anyhow"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
