[package]
name = "soil-desktop-store"
description = "Records-backed Teams, Desktops and share tickets"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
fungos-records.workspace = true
serde = "1"
serde_json = "1"
soil-desktop = { path = "../soil-desktop" }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
