[package]
name = "soil-shell"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "soil"
path = "src/main.rs"

[dependencies]
soil-dev-host = { path = "../soil-dev-host" }
anyhow = "1"
# The announcer is a child process; `PR_SET_PDEATHSIG` is what stops it
# outliving the node it advertises.
libc = "0.2"
fungos-vfs = { git = "https://github.com/mycelium-linux/fungos-vfs.git", rev = "8ad45a7fb1ce01fbbc6f764d10524baf5a24c0af" }
soil = { path = "../soil" }
serde = { version = "1", features = ["derive"] }
# Hosting any `.spore`: the launcher is the generic one, so it links the host
# instead of re-implementing it per product.
soil-spore = { path = "../soil-spore" }
# Installing is the host's act: the window names a listing and this fetches,
# verifies and writes it.
soil-install = { path = "../soil-install" }
soil-web-bridge = { path = "../soil-web-bridge" }
# The command registry and runner: `soil command …` is the same CLI the
# standalone `soil-command` binary runs, so a shell spore installs into is the
# same one `soil` knows about.
soil-command = { path = "../soil-command" }
# The one runner owns every presentation: the window, the frame, the
# framebuffer. Each is a library the runner composes, never a binary of its own.
canvas-winit = { path = "../canvas-winit" }
soil-webgpu = { path = "../soil-webgpu" }
soil-agent-records = { path = "../soil-agent-records" }
image = { version = "0.25", default-features = false, features = ["png"] }
pollster = "0.4"
http = "1"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unibus = { git = "https://github.com/mycelium-linux/unibus.git", rev = "8bf8f79" }
url = "2"

[dev-dependencies]
tempfile = "3"
