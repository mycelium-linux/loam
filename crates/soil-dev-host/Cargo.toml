[package]
name = "soil-dev-host"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "soil_dev_host"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
soil-ble-host = { path = "../soil-ble-host" }
soil-notify-host = { path = "../soil-notify-host" }
serde_json = "1"
soil = { path = "../soil", default-features = false, features = ["http", "records", "wasi"] }
wasmtime = { version = "50", features = ["anyhow"] }
wasmtime-wasi = "50"
