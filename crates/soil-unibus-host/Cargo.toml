[package]
name = "soil-unibus-host"
description = "Host side of soil:unibus: bounded poll and publish over the Unibus"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
anyhow = "1"
serde_json = "1"
tracing = "0.1"
unibus = { git = "https://github.com/fungOS-linux/unibus.git", rev = "8bf8f79" }
unibus-sdk = { git = "https://github.com/fungOS-linux/unibus.git", rev = "8bf8f79" }
wasmtime = { version = "50", features = ["anyhow"] }

[lints]
workspace = true
