[package]
name = "loam-ble-host"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "soil_ble_host"

[dependencies]
anyhow = "1"
soil-ble-api = { package = "loam-ble-api", path = "../loam-ble-api" }
soil-ble-sim = { package = "loam-ble-sim", path = "../loam-ble-sim" }
wasmtime = { version = "50", features = ["anyhow"] }
wasmtime-wasi = "50"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
btleplug = "0.11"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
# Static libdbus so a musl host does not need a target sysroot.
libdbus-sys = { version = "0.2", features = ["vendored"] }

