[workspace]
members = ["crates/loam", "crates/loam-cli", "crates/loam-command", "crates/loam-codec", "crates/loam-inference", "crates/loam-inference-host", "crates/loam-scrub", "crates/loam-spore", "crates/loam-ble-api", "crates/loam-ble-host", "crates/loam-ble-sim", "crates/loam-audio"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/mycelium-linux/loam"

# `fungos-records` is the on-disk records format shared by the records host, the
# sync host and every book consumer. Two revisions in one workspace means two
# incompatible `Store` types and two `unibus` copies, so it is declared once
# here and only here; a bump is one edit that moves every crate together.
[workspace.dependencies]
fungos-records = { git = "https://github.com/mycelium-linux/records.git", rev = "1fa03a239b6191f61ecf9d5f9c5284ba9045a1cd" }

[workspace.lints.rust]
unsafe_code = "forbid"
