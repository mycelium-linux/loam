schema = 1

[spore]
id = "org.mycelium.hello-soil"
name = "hello-soil"
version = "0.1.0"
license = "MIT OR Apache-2.0"
summary = "A tiny Soil 101 web surface served at hello.myc"

[engine]
soil = ">=0.1"
target = "wasm32-wasip2"

[launch]
default = "web"
surfaces = ["web"]

[[surfaces]]
name = "hello"
kind = "web"
entry = "web/index.html"

[anycast]
name = "hello"
kind = "web"
alpns = ["soil/http/1"]
ttl_secs = 240
