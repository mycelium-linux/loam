schema = 1

[spore]
id = "org.mycelium.contacts"
name = "contacts"
version = "0.1.0"
license = "Apache-2.0 OR MIT"
summary = "Personal contacts over the Soil records book"

[engine]
soil = ">=0.1"
target = "wasm32-wasip2"

[launch]
default = "web"
surfaces = ["web"]

[[surfaces]]
name = "web"
kind = "web"
entry = "web/index.html"

[records]
book = "personal/avery/contacts"
collection = "contact"

[anycast]
name = "contacts"
kind = "contacts"
alpns = ["soil/http/1"]
ttl_secs = 240

[grants]
"soil:records.read" = "read contacts from the personal records book"
"soil:records.write" = "save individual contacts with compare-and-swap"

[denied]
"soil:http" = ["contact data has no network authority"]
"wasi:filesystem" = ["the host owns the records store"]

[presentation]
badge = "C"
color = "#7fb2a8"
