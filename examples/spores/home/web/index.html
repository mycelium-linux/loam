<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#071119">
  <title>Mycelium — Desktop</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="preload" as="image" href="/assets/wallpaper.webp" fetchpriority="high">
  <link rel="stylesheet" href="/desktop.css">
</head>
<body>
  <div class="wallpaper" aria-hidden="true"></div>

  <header class="topbar">
    <div class="topbar-left">
      <button class="brand" type="button" data-open="desk" aria-label="Open This Desk">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="5" r="2.1"/><circle cx="5" cy="17.2" r="2.1"/><circle cx="19" cy="17.2" r="2.1"/><path d="M10.6 6.8 6.1 15.3M13.4 6.8l4.5 8.5M7.1 17.2h9.8"/></svg>
        <span>Mycelium</span>
      </button>
      <span class="topbar-sep" aria-hidden="true"></span>
      <button class="desktop-current" type="button" data-open="desk" aria-label="Open This Desk">
        <span class="workspace-name">This Mac</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m8 10 4 4 4-4"/></svg>
      </button>
      <span class="plan-badge">Local</span>
    </div>
    <div class="topbar-right">
      <button class="topbar-button command-trigger" type="button" data-command-toggle aria-label="Open command">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="10.7" cy="10.7" r="6.2"/><path d="m15.4 15.4 4.1 4.1"/></svg>
        <span>Command</span>
        <kbd>⌘K</kbd>
      </button>
      <time class="clock" id="clock" datetime=""></time>
      <span class="avatar" aria-hidden="true">M</span>
    </div>
  </header>

  <main class="desktop" aria-label="Desktop">
    <div class="desktop-icons" aria-label="Desktop items">
      <button class="desktop-icon" type="button" data-open="notes" aria-label="Open Notes">
        <span class="app-tile app-notes" aria-hidden="true">N</span><span>Notes</span>
      </button>
      <button class="desktop-icon" type="button" data-open="contacts" aria-label="Open People">
        <span class="app-tile app-people" aria-hidden="true">P</span><span>People</span>
      </button>
      <button class="desktop-icon" type="button" data-open="files" aria-label="Open Files">
        <span class="app-tile app-files" aria-hidden="true">F</span><span>Files</span>
      </button>
    </div>

    <section class="window window--notes" data-window="notes" hidden>
      <header class="window-bar">
        <div class="traffic">
          <button class="close" type="button" data-close="notes" aria-label="Close Notes"><span aria-hidden="true">×</span></button>
          <button class="minimize" type="button" data-minimize="notes" aria-label="Minimize Notes"><span aria-hidden="true">−</span></button>
          <button class="zoom" type="button" data-zoom="notes" aria-label="Zoom Notes"><span aria-hidden="true">+</span></button>
        </div>
        <h2 class="window-title">Notes</h2>
        <span class="window-bar-spacer" aria-hidden="true"></span>
      </header>
      <iframe data-src="https://notes.myc/" title="Notes" loading="lazy"></iframe>
      <span class="window-resize" data-resize="notes" aria-hidden="true"></span>
    </section>

    <section class="window window--people" data-window="contacts" hidden>
      <header class="window-bar">
        <div class="traffic">
          <button class="close" type="button" data-close="contacts" aria-label="Close People"><span aria-hidden="true">×</span></button>
          <button class="minimize" type="button" data-minimize="contacts" aria-label="Minimize People"><span aria-hidden="true">−</span></button>
          <button class="zoom" type="button" data-zoom="contacts" aria-label="Zoom People"><span aria-hidden="true">+</span></button>
        </div>
        <h2 class="window-title">People</h2>
        <span class="window-bar-spacer" aria-hidden="true"></span>
      </header>
      <iframe data-src="https://contacts.myc/" title="People" loading="lazy"></iframe>
      <span class="window-resize" data-resize="contacts" aria-hidden="true"></span>
    </section>

    <section class="window window--files" data-window="files" hidden>
      <header class="window-bar">
        <div class="traffic">
          <button class="close" type="button" data-close="files" aria-label="Close Files"><span aria-hidden="true">×</span></button>
          <button class="minimize" type="button" data-minimize="files" aria-label="Minimize Files"><span aria-hidden="true">−</span></button>
          <button class="zoom" type="button" data-zoom="files" aria-label="Zoom Files"><span aria-hidden="true">+</span></button>
        </div>
        <h2 class="window-title">Files</h2>
        <span class="window-bar-spacer" aria-hidden="true"></span>
      </header>
      <iframe data-src="https://files.myc/" title="Files" loading="lazy"></iframe>
      <span class="window-resize" data-resize="files" aria-hidden="true"></span>
    </section>

    <section class="window window--desk" data-window="desk" hidden>
      <header class="window-bar">
        <div class="traffic">
          <button class="close" type="button" data-close="desk" aria-label="Close This Desk"><span aria-hidden="true">×</span></button>
          <button class="minimize" type="button" data-minimize="desk" aria-label="Minimize This Desk"><span aria-hidden="true">−</span></button>
          <button class="zoom" type="button" data-zoom="desk" aria-label="Zoom This Desk"><span aria-hidden="true">+</span></button>
        </div>
        <h2 class="window-title">This Desk</h2>
        <span class="window-bar-spacer" aria-hidden="true"></span>
      </header>
      <div class="request-surface">
        <p class="request-label">Local Mycelium</p>
        <blockquote class="request-prompt">Your notes, people and files are on this machine. The apps are Spores; the data is in the workspace VFS.</blockquote>
        <p class="request-note"><a class="surface-action" href="https://notes.myc/">Open Notes</a> <a class="surface-action" href="https://contacts.myc/">Open People</a></p>
      </div>
    </section>
  </main>

  <nav class="dock" aria-label="Applications">
    <button class="dock-button" type="button" data-open="files" data-label="Files" aria-label="Files"><span class="app-tile app-files" aria-hidden="true">F</span></button>
    <button class="dock-button" type="button" data-open="notes" data-label="Notes" aria-label="Notes"><span class="app-tile app-notes" aria-hidden="true">N</span></button>
    <button class="dock-button" type="button" data-open="contacts" data-label="People" aria-label="People"><span class="app-tile app-people" aria-hidden="true">P</span></button>
    <div class="dock-divider" aria-hidden="true"></div>
    <button class="dock-button" type="button" data-open="desk" data-label="This Desk" aria-label="This Desk"><span class="app-tile app-desk" aria-hidden="true">D</span></button>
  </nav>

  <div class="command-scrim" data-command-scrim aria-hidden="true"></div>
  <section class="command" id="command" aria-label="Command" aria-hidden="true" inert>
    <form class="command-form" id="command-form">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="10.7" cy="10.7" r="6.2"/><path d="m15.4 15.4 4.1 4.1"/></svg>
      <input class="command-input" id="command-input" name="prompt" type="text" placeholder="Open Notes, People or Files" autocomplete="off" spellcheck="false">
    </form>
    <div class="command-results">
      <button class="command-result" type="button" data-open="notes"><span class="app-tile app-notes" aria-hidden="true">N</span><span class="command-result-label">Open Notes</span><kbd>↵</kbd></button>
      <button class="command-result" type="button" data-open="contacts"><span class="app-tile app-people" aria-hidden="true">P</span><span class="command-result-label">Open People</span><kbd>↵</kbd></button>
      <button class="command-result" type="button" data-open="files"><span class="app-tile app-files" aria-hidden="true">F</span><span class="command-result-label">Open Files</span><kbd>↵</kbd></button>
    </div>
    <footer class="command-footer"><span><kbd>↵</kbd> to open</span><span><kbd>esc</kbd> to close</span></footer>
  </section>

  <script src="/desktop.js"></script>
</body>
</html>
