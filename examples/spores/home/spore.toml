schema = 1

[spore]
id = "org.mycelium.home"
name = "home"
version = "0.1.0"
license = "Apache-2.0 OR MIT"
summary = "The Mycelium desktop shell, served as a local web Spore"

[engine]
soil = ">=0.1"
target = "wasm32-wasip2"

[launch]
default = "web"
surfaces = ["web"]

[[surfaces]]
name = "web"
kind = "web"
entry = "web/index.html"

[grants]
"soil:vfs" = "read the workspace desktop index"
"soil:vfs-mut" = "create and update desktop metadata"

[web]
vfs_root = ""

[anycast]
name = "home"
kind = "home"
alpns = ["soil/http/1"]
ttl_secs = 240

[presentation]
badge = "M"
color = "#ffd08a"
